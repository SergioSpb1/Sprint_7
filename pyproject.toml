[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprint_7_api"
version = "0.1.0"
description = "API tests for Yandex Scooter Sprint 7"
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
dependencies = [
    "requests>=2.31",
    "pytest>=8.0",
    "allure-pytest>=2.16",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]